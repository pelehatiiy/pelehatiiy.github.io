<style>
/* Layout: one narrow column like an exam sheet; questions sit on squared notebook paper with a red margin line. */
:root {
  --paper: #f3f5f9;
  --card: #ffffff;
  --ink: #141c33;
  --muted: #5a6379;
  --line: #d9dee9;
  --grid: rgba(35, 67, 168, 0.075);
  --margin: #e9a49d;
  --accent: #2343a8;
  --accent-ink: #ffffff;
  --accent-soft: #e4e9fa;
  --ok: #1d7a4c;
  --ok-soft: #e0f2e8;
  --part: #9a6300;
  --part-soft: #fbefd6;
  --bad: #c2352a;
  --bad-soft: #fbe5e2;
  --f-display: "Literata", "Georgia", "Times New Roman", serif;
  --f-ui: "Golos Text", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #10141c; --card: #171c27; --ink: #e7ebf3; --muted: #98a1b4; --line: #283041;
    --grid: rgba(150, 172, 230, 0.06); --margin: #5d3036; --accent: #93aaff; --accent-ink: #0f1424;
    --accent-soft: #1d2645; --ok: #6fd3a0; --ok-soft: #15302a; --part: #f0c062; --part-soft: #352a14;
    --bad: #ff8b80; --bad-soft: #3a1f22; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #10141c; --card: #171c27; --ink: #e7ebf3; --muted: #98a1b4; --line: #283041;
  --grid: rgba(150, 172, 230, 0.06); --margin: #5d3036; --accent: #93aaff; --accent-ink: #0f1424;
  --accent-soft: #1d2645; --ok: #6fd3a0; --ok-soft: #15302a; --part: #f0c062; --part-soft: #352a14;
  --bad: #ff8b80; --bad-soft: #3a1f22; color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--paper); color: var(--ink); font-family: var(--f-ui); font-size: 15px; line-height: 1.5;
  -webkit-text-size-adjust: 100%;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
button, input, textarea, select { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

.wrap { max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* header */
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); border-bottom: 1px solid var(--line); }
header.top .wrap { display: flex; align-items: center; gap: 12px; padding-block: 10px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 10px; margin-right: auto; min-width: 0; }
.brand b { font-family: var(--f-display); font-weight: 600; font-size: 1.15rem; letter-spacing: -0.01em; white-space: nowrap; }
.brand span { font-family: var(--f-mono); font-size: 0.72rem; color: var(--muted); letter-spacing: 0.04em; white-space: nowrap; }
nav.tabs { display: flex; gap: 2px; background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
nav.tabs button { border: 0; background: transparent; padding: 5px 12px; border-radius: 999px; cursor: pointer; font-size: 0.86rem; color: var(--muted); }
nav.tabs button[aria-current="page"] { background: var(--accent); color: var(--accent-ink); }

main.wrap { padding-block: 20px 64px; display: grid; gap: 18px; }

/* shared bits */
.eyebrow { font-family: var(--f-mono); font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
h1, h2, h3 { text-wrap: balance; margin: 0; }
h1 { font-family: var(--f-display); font-weight: 600; font-size: clamp(1.5rem, 4.6vw, 2rem); line-height: 1.15; letter-spacing: -0.015em; }
h2 { font-family: var(--f-display); font-weight: 600; font-size: 1.2rem; }
h3 { font-size: 0.95rem; font-weight: 600; }
p { margin: 0; }
.muted { color: var(--muted); }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 12px; min-width: 0; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.stack { display: grid; gap: 10px; min-width: 0; }
.btn { border: 1px solid var(--line); background: var(--card); padding: 9px 14px; border-radius: 8px; cursor: pointer; font-weight: 500; font-size: 0.92rem; display: inline-flex; align-items: center; gap: 6px; text-decoration: none; color: var(--ink); }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.big { padding: 12px 20px; font-size: 1rem; font-weight: 600; }
.btn.ghost { background: transparent; }
.btn.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.btn.part { background: var(--part-soft); color: var(--part); border-color: transparent; }
.btn.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.btn[disabled] { opacity: 0.5; cursor: default; }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 0.78rem; padding: 2px 9px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.chip.plain { background: transparent; border: 1px solid var(--line); color: var(--muted); }
.chip.sec { font-family: var(--f-mono); background: transparent; border: 1px solid var(--line); color: var(--ink); }
.notice { border: 1px dashed var(--line); border-radius: var(--r); padding: 14px 16px; color: var(--muted); }

/* today */
.today-hero { display: grid; gap: 14px; }
.plan-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.split { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 620px) { .split { grid-template-columns: 1fr; } }
.countdown { display: flex; align-items: baseline; gap: 8px; }
.countdown .n { font-family: var(--f-display); font-size: 2.2rem; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; }
.reread { display: grid; gap: 8px; }
.reread-item { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
.reread-item:first-child { border-top: 0; }
.reread-item .t { min-width: 0; }
.modes { display: flex; flex-wrap: wrap; gap: 8px; }

/* sheet (question) */
.sheet {
  background-color: var(--card);
  background-image:
    linear-gradient(to right, transparent 34px, var(--margin) 34px, var(--margin) 35.5px, transparent 35.5px),
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 100% 100%, 20px 20px, 20px 20px;
  border: 1px solid var(--line); border-radius: var(--r);
  padding: 18px 18px 20px 52px; display: grid; gap: 16px; min-width: 0;
}
@media (max-width: 480px) { .sheet { padding-left: 46px; padding-right: 14px; } .sheet { background-image: linear-gradient(to right, transparent 30px, var(--margin) 30px, var(--margin) 31.5px, transparent 31.5px), linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); } }
.qmeta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.qtext { font-family: var(--f-display); font-size: 1.14rem; line-height: 1.6; min-width: 0; overflow-wrap: anywhere; }
.qtext p + p { margin-top: 0.6em; }
.prose { min-width: 0; overflow-wrap: anywhere; }
.prose p + p, .prose ul, .prose ol, .prose p + ul, .prose ul + p, .prose ol + p { margin-top: 0.5em; }
.prose ul, .prose ol { padding-left: 1.3em; margin-bottom: 0; }
.prose li + li { margin-top: 0.2em; }
.qtext ul, .qtext ol { padding-left: 1.3em; margin: 0.4em 0 0; }
mjx-container { max-width: 100%; }
mjx-container[display="true"] { overflow-x: auto; overflow-y: hidden; padding: 2px 0; }

.progress { display: flex; align-items: center; gap: 10px; }
.progress .bar { flex: 1; height: 6px; border-radius: 99px; background: var(--line); overflow: hidden; }
.progress .bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .3s; }
.choices { display: grid; gap: 8px; }
.choice { text-align: left; border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 11px 14px; cursor: pointer; display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: baseline; }
.choice .k { font-family: var(--f-mono); color: var(--muted); }
.choice:hover:not([disabled]) { border-color: var(--accent); }
.choice.is-ok { border-color: var(--ok); background: var(--ok-soft); }
.choice.is-bad { border-color: var(--bad); background: var(--bad-soft); }
.yn { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.yn .btn { justify-content: center; padding: 14px; font-size: 1.05rem; }
.yn .btn.is-ok { background: var(--ok-soft); color: var(--ok); border-color: var(--ok); }
.yn .btn.is-bad { background: var(--bad-soft); color: var(--bad); border-color: var(--bad); }
textarea, input[type="text"] { width: 100%; border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 10px 12px; font-size: 16px; line-height: 1.5; }
textarea { min-height: 120px; resize: vertical; font-family: var(--f-mono); font-size: 15px; }
textarea:focus, input[type="text"]:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }
.preview { border-left: 3px solid var(--accent-soft); padding-left: 12px; }
.hint { background: var(--accent-soft); border-radius: 8px; padding: 10px 12px; font-size: 0.93rem; }
.photo-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.photo-row img { max-height: 120px; border-radius: 6px; border: 1px solid var(--line); }
.filelbl { position: relative; overflow: hidden; }
.filelbl input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

.feedback { border-radius: var(--r); padding: 14px 16px; display: grid; gap: 10px; border: 1px solid var(--line); background: var(--card); min-width: 0; }
.feedback.g2 { border-color: var(--ok); }
.feedback.g1 { border-color: var(--part); }
.feedback.g0 { border-color: var(--bad); }
.verdict { font-weight: 700; font-size: 1.02rem; }
.g2 .verdict { color: var(--ok); } .g1 .verdict { color: var(--part); } .g0 .verdict { color: var(--bad); }
.model { border-top: 1px dashed var(--line); padding-top: 10px; }
.model .lbl { margin-bottom: 4px; }
.ref { display: flex; gap: 10px; align-items: flex-start; background: var(--bad-soft); color: var(--ink); border-radius: 8px; padding: 10px 12px; text-decoration: none; }
.ref.calm { background: var(--accent-soft); }
.ref .sec { font-family: var(--f-mono); font-weight: 600; color: var(--bad); white-space: nowrap; }
.ref.calm .sec { color: var(--accent); }
.checklist { display: grid; gap: 6px; }
.checklist label { display: grid; grid-template-columns: auto 1fr; gap: 8px; align-items: start; cursor: pointer; }
.checklist input { margin-top: 4px; accent-color: var(--accent); }
.ai { background: var(--paper); border-radius: 8px; padding: 12px; display: grid; gap: 6px; }
.ai ul { margin: 0; padding-left: 1.2em; }
.gradebar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.gradebar .btn { justify-content: center; }
.gradebar .btn.sel { outline: 2px solid currentColor; outline-offset: 1px; }
.nav-row { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }

/* stats */
.kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.kpi { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; }
.kpi .v { font-family: var(--f-display); font-size: 1.6rem; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.1; }
@media (max-width: 480px) { .kpi .v { font-size: 1.3rem; } }
.days { display: grid; grid-template-columns: repeat(28, 1fr); gap: 3px; }
.days i { aspect-ratio: 1; border-radius: 3px; background: var(--line); max-width: 100%; }
.days i.d1 { background: var(--accent-soft); outline: 1px solid var(--accent); outline-offset: -1px; }
.days i.d2 { background: var(--accent); }
.chap { display: grid; gap: 4px; }
.chap-head { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; padding-top: 10px; border-top: 1px solid var(--line); }
.chap:first-child .chap-head { border-top: 0; padding-top: 0; }
.secrow { display: grid; grid-template-columns: 62px minmax(0, 1fr) 100px 64px; gap: 10px; align-items: center; padding: 5px 0; font-size: 0.9rem; }
.secrow > .mono.muted { white-space: nowrap; text-align: right; }
.secrow > .tr, .secrow > span:last-child { justify-self: end; }
.secrow .meter { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; display: flex; }
.secrow .meter .m { background: var(--ok); }
.secrow .meter .l { background: var(--part); opacity: 0.7; }
.secrow .tr { border: 0; background: none; color: var(--accent); cursor: pointer; padding: 2px 4px; font-size: 0.85rem; }
@media (max-width: 480px) { .secrow { grid-template-columns: 46px minmax(0, 1fr) 92px 58px; gap: 8px; } }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 0.8rem; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }

/* bank */
.filters { display: grid; gap: 8px; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 4px 11px; font-size: 0.84rem; cursor: pointer; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.qitem { border-top: 1px solid var(--line); padding: 10px 0; display: grid; gap: 8px; }
.qitem summary { cursor: pointer; display: grid; grid-template-columns: 10px 1fr; gap: 10px; align-items: baseline; list-style: none; }
.qitem summary::-webkit-details-marker { display: none; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--line); display: inline-block; }
.dot.b1 { background: var(--bad); } .dot.b2 { background: var(--part); } .dot.b3 { background: var(--ok); opacity: .6 } .dot.b4 { background: var(--ok); }
.qitem .body { padding-left: 20px; display: grid; gap: 8px; }

.done-card { text-align: left; }
.tally { display: flex; gap: 14px; flex-wrap: wrap; }
.tally span b { font-family: var(--f-display); font-size: 1.4rem; margin-right: 4px; }
.spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; vertical-align: -2px; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spinner { animation: none; } .progress .bar i { transition: none; } }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--paper); padding: 9px 16px; border-radius: 8px; font-size: 0.9rem; z-index: 20; max-width: calc(100% - 32px); }

.webnote { border-bottom: 1px solid var(--line); background: var(--accent-soft); color: var(--ink); font-size: 0.86rem; }
.webnote .wrap { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: baseline; justify-content: space-between; padding-block: 8px; }
.webnote a { font-weight: 600; text-decoration: none; }
.webnote a:hover { text-decoration: underline; }
</style>
</head>

/* ---------------- course logic ---------------- */
function coveredSecs(d = today()) { return state.config.weeks.filter(w => w.from <= d).flatMap(w => w.secs); }

  if (mode === "weak") { const p = state.P[q.id]; return p && (p.box <= 1 || (p.bad + 0.5 * (p.part || 0)) / Math.max(1, p.n) >= 0.4); }

    const ch = chapOf(q.sec);

/* spaced repetition: boxes 1..6 */
const INTERVALS = [0, 1, 3, 7, 14, 30, 60];
function schedule(prev, g) {
  const d = today();
  let box = prev ? prev.box : 0;
  let due;
  if (g === 2) { box = prev ? Math.min(6, box + 1) : 2; due = addDays(d, INTERVALS[box]); }
  else if (g === 1) { box = Math.max(1, box); due = addDays(d, Math.max(1, Math.floor(INTERVALS[box] / 3))); }
  else { box = 1; due = addDays(d, 1); }
  return { box, due };
}

function buildDailyPlan(dateStr) {
  const d = dateStr || today();
  const r = rng(hashStr(d));
  const qs = allQ().filter(q => inMode(q, "daily"));
  const P = state.P;
  const budget = Number(state.config.minutes) || 18;
  const cur = currentWeek(d); const curSecs = cur ? cur.secs : [];
  const due = shuffle(qs.filter(q => P[q.id] && P[q.id].due <= d), r).sort((a, b) => P[a.id].due.localeCompare(P[b.id].due) || P[a.id].box - P[b.id].box);
  // new material: this week's sections first, the rest mixed across all covered chapters
  const fresh = shuffle(qs.filter(q => !P[q.id]), r).sort((a, b) => within(b.sec, curSecs) - within(a.sec, curSecs));
  const picked = new Set(); const plan = []; let mins = 0;
  const take = q => { if (!q || picked.has(q.id)) return false; picked.add(q.id); plan.push(q); mins += TYPES[q.type].min; return true; };
  // heavy slot rotates by weekday: Mon proof, Tue calc, Wed proof, Thu think, Fri proof, Sat calc, Sun think
  const wd = new Date(d + "T12:00:00Z").getUTCDay();
  const heavyPref = ["think", "proof", "calc", "proof", "think", "proof", "calc"][wd];
  const heavyOrder = [heavyPref, "proof", "calc", "think"];
  let heavy = null;
  for (const t of heavyOrder) { heavy = due.find(q => q.type === t) || fresh.find(q => q.type === t); if (heavy) break; }
  // definition / theorem slot
  const defSlot = due.find(q => q.type === "def" || q.type === "thm") || fresh.find(q => q.type === "def" || q.type === "thm");
  const lightBudget = budget - (heavy ? TYPES[heavy.type].min : 0) - (defSlot ? TYPES[defSlot.type].min : 0);
  const reviewBudget = lightBudget * 0.6;
  const reviews = [];
  for (const q of due) { if (!TYPES[q.type].light || q === defSlot) continue; if (mins + TYPES[q.type].min > reviewBudget) break; if (take(q)) reviews.push(q); }
  for (const q of fresh) { if (!TYPES[q.type].light || q === defSlot) continue; if (mins + TYPES[q.type].min > lightBudget) continue; take(q); if (plan.length >= 10) break; }
  // fill with more reviews if new material ran out
  for (const q of due) { if (!TYPES[q.type].light || q === defSlot) continue; if (mins + TYPES[q.type].min > lightBudget) break; take(q); }
  // order: quick yes/no + choice first, then short, then def slot, heavy last
  const rank = { yn: 0, mc: 1, short: 2, def: 3, thm: 3 };
  plan.sort((a, b) => rank[a.type] - rank[b.type]);
  if (defSlot) take(defSlot);

}

  const d = today(); const r = rng(Date.now());

  const P = state.P;
  const score = q => { const p = P[q.id]; if (!p) return 2.5; return (p.due <= d ? 0 : 3) + p.box; };
  qs.sort((a, b) => score(a) - score(b));
  const out = []; let heavy = 0;
  for (const q of qs) { if (TYPES[q.type].heavy) { if (heavy >= 2) continue; heavy++; } out.push(q); if (out.length >= n) break; }
  const rank = { yn: 0, mc: 1, short: 2, def: 3, thm: 3, calc: 4, proof: 5, think: 5 };
  out.sort((a, b) => rank[a.type] - rank[b.type]);

}

  const okAns = seen.reduce((s, q) => s + (P[q.id].ok || 0), 0);
  const d = today();
  const byDate = {}; state.logs.forEach(l => { if (l) byDate[l.date] = l; }); if (state.log) byDate[d] = state.log;
  const strip = Array.from({ length: 28 }, (_, i) => { const dd = addDays(d, i - 27); const l = byDate[dd]; const cls = l && l.done ? "d2" : (l && ((l.answered || 0) > 0 || l.idx > 0) ? "d1" : ""); return `<i class="${cls}" title="${dd}"></i>`; }).join("");
  const chapters = {};
  qs.forEach(q => { const c = chapOf(q.sec); const k = (q.ref && q.ref.s) ? q.ref.s.split(".").slice(0, 2).join(".") : q.sec.split(".").slice(0, 2).join("."); ((chapters[c] = chapters[c] || {})[k] = chapters[c][k] || []).push(q); });
  const chapHtml = Object.keys(chapters).sort((a, b) => a - b).map(c => {
    const secs = Object.keys(chapters[c]).sort(secCmp);
    const rows = secs.map(s => {
      const list = chapters[c][s]; const tot = list.length;
      const m = list.filter(q => P[q.id] && P[q.id].box >= 4).length; const l = list.filter(q => P[q.id] && P[q.id].box < 4).length;
      const n = list.reduce((a, q) => a + ((P[q.id] && P[q.id].n) || 0), 0); const ok = list.reduce((a, q) => a + ((P[q.id] && P[q.id].ok) || 0), 0);

        <span class="mono muted" style="font-size:.8rem">${n ? Math.round(ok / n * 100) + "% · " : ""}${m}/${tot}</span>
        ${cov ? `<button class="tr" data-act="extra" data-mode="sec:${esc(s)}">trénovat</button>` : `<span class="muted" style="font-size:.78rem">brzy</span>`}</div>`;
    }).join("");
    return `<div class="chap"><div class="chap-head"><h3>${c}. ${esc(state.config.chapters[c] || "")}</h3></div>${rows}</div>`;
  }).join("");
  return `<section class="stack"><span class="eyebrow">Pokrok</span><h1>Co už umíš</h1></section>
    <div class="kpis">
      <div class="kpi"><div class="v">${streak()}</div><div class="muted">${plural(streak(), "den", "dny", "dní")} v řadě</div></div>
      <div class="kpi"><div class="v">${mastered}<span class="muted" style="font-size:.9rem"> / ${qs.length}</span></div><div class="muted">zvládnuto</div></div>
      <div class="kpi"><div class="v">${answers ? Math.round(okAns / answers * 100) + "%" : "—"}</div><div class="muted">správně</div></div>
    </div>
    <section class="panel"><div class="row" style="justify-content:space-between"><span class="eyebrow">Poslední 4 týdny</span><span class="muted mono" style="font-size:.78rem">${esc(fmtDate(addDays(d, -27), { day: "numeric", month: "numeric" }))} – ${esc(fmtDate(d, { day: "numeric", month: "numeric" }))}</span></div>
      <div class="days">${strip}</div>
      <div class="legend"><span><i style="background:var(--accent)"></i>sezení dokončeno</span><span><i style="background:var(--accent-soft);outline:1px solid var(--accent)"></i>částečně</span></div></section>
    <section class="panel"><div class="legend"><span><i style="background:var(--ok)"></i>zvládnuto (opakování za ≥ 14 dní)</span><span><i style="background:var(--part);opacity:.7"></i>rozpracováno</span><span><i style="background:var(--line)"></i>zatím nebylo</span></div>
      ${chapHtml || `<p class="muted">Zatím tu nejsou otázky.</p>`}</section>`;
}

/* ---------------- views: bank ---------------- */

/* ---------------- binding ---------------- */
function bindView(el) {
  el.querySelectorAll("[data-act]").forEach(b => b.addEventListener("click", onAct));
  el.querySelectorAll(".seg [data-f]").forEach(b => b.addEventListener("click", () => { const k = b.dataset.f; state.bankFilter[k] = k === "ch" ? Number(b.dataset.v) : b.dataset.v; render(); }));
  const s = $("#bank-search", el);
  if (s) { let t; s.addEventListener("input", () => { clearTimeout(t); t = setTimeout(() => { state.bankFilter.text = s.value; const pos = s.selectionStart; render(); const n = $("#bank-search"); if (n) { n.focus(); n.setSelectionRange(pos, pos); } }, 250); }); }
}
async function onAct(e) {
  const b = e.currentTarget; const act = b.dataset.act;
  if (act === "start") return startDaily();
  if (act === "extra") return startExtra(b.dataset.mode);
  if (act === "read") {
    const sec = b.dataset.sec.replace(/[^0-9.]/g, "");
    if (!state.db || !sec) return;
    b.disabled = true;
    state.R[sec] = { sec, ts: Date.now(), date: today() }; render();
    queueWrite("reading/" + sec, () => state.db.doc("reading/" + sec).set(state.R[sec]));
  }
}

/* ---------------- sessions ---------------- */
function startDaily() {
  const d = today();
  let log = state.log;
  if (!log || !log.plan || log.date !== d) {
    log = { date: d, mode: "daily", plan: buildDailyPlan(d), idx: 0, res: {}, done: false, answered: 0, extraN: (log && log.date === d && log.extraN) || 0, t0: Date.now() };
  } else log = JSON.parse(JSON.stringify(log));
  log.plan = log.plan.filter(it => state.Q.has(it.id));
  if (!log.plan.length) { toast("Na dnešek nejsou žádné otázky."); return; }
  state.log = log;
  state.session = { kind: "daily", plan: log.plan, idx: log.idx || 0, res: log.res || {} };
  saveLog();
  go("today");
}
function startExtra(mode) {
  const plan = buildExtraPlan(mode, mode.startsWith("q:") ? 1 : 10);
  if (!plan.length) { toast("Pro tento režim zatím nejsou otázky."); return; }
  state.session = { kind: "extra", mode, plan, idx: 0, res: {} };
  state.view = "today";
  document.querySelectorAll("nav.tabs button").forEach(x => { if (x.dataset.view === "today") x.setAttribute("aria-current", "page"); else x.removeAttribute("aria-current"); });
  render(); window.scrollTo({ top: 0 });
}
function saveLog() {
  if (!state.db || !state.log) return;
  const snap = JSON.parse(JSON.stringify(state.log));
  queueWrite("log/" + snap.date, () => state.db.doc("log/" + snap.date).set(snap));
}
function endSession(abort) {
  const s = state.session; state.session = null;
  if (s && s.kind === "daily" && state.log && !abort) { state.log.done = true; state.log.t1 = Date.now(); saveLog(); loadLogs(); }
  render(); window.scrollTo({ top: 0 });
}

      ${ai.komentar ? `<div class="prose">${md(ai.komentar)}</div>` : ""}
      ${ai.chyby.length ? `<div><span class="eyebrow">Chyby</span><ul>${ai.chyby.map(x => `<li>${inline(x)}</li>`).join("")}</ul></div>` : ""}
      ${ai.chybi.length ? `<div><span class="eyebrow">Chybí</span><ul>${ai.chybi.map(x => `<li>${inline(x)}</li>`).join("")}</ul></div>` : ""}</div>` : ""}
    <div class="feedback"><div class="model"><div class="eyebrow lbl">Vzorové řešení</div><div class="prose">${md(q.model || "")}</div></div>
      ${q.why ? `<div class="prose muted">${md(q.why)}</div>` : ""}
      ${checks && !ai ? `<div class="stack"><span class="eyebrow">Co tvoje odpověď obsahovala?</span><div class="checklist">${checks}</div></div>` : ""}
    </div>
    <div class="stack" id="grade-stack"><span class="eyebrow">Ohodnoť se</span>
      <div class="gradebar"><button class="btn bad" data-g="0">Nevěděl</button><button class="btn part" data-g="1">Částečně</button><button class="btn ok" data-g="2">Věděl</button></div></div>`;
  const pick = g => fb.querySelectorAll(".gradebar .btn").forEach(b => b.classList.toggle("sel", Number(b.dataset.g) === g));
  if (suggest !== null) pick(suggest);
  fb.querySelectorAll(".checklist input").forEach(cb => cb.addEventListener("change", () => {
    const all = fb.querySelectorAll(".checklist input"); const n = [...all].filter(x => x.checked).length;
    pick(n === all.length ? 2 : n >= Math.ceil(all.length / 2) ? 1 : 0);
  }));
  fb.querySelectorAll(".gradebar .btn").forEach(b => b.addEventListener("click", () => { pick(Number(b.dataset.g)); $("#grade-stack").remove(); finish(Number(b.dataset.g), { written: true }); }));
  typeset(fb);
}

function finish(g, opts = {}) {
  if (cur.answered) return; cur.answered = true; cur.g = g;
  const q = cur.q; const s = state.session; const it = cur.it;
  const fb = $("#fb");
  const showModel = !opts.written && (q.model || q.type === "short");
  const block = document.createElement("div");
  block.className = "feedback g" + g;
  block.innerHTML = `<span class="verdict">${["Špatně", "Částečně", "Správně"][g]}${q.type === "short" && g < 2 ? ` · správně: <span class="mono">${esc(q.answer || (q.accept || [])[0] || "")}</span>` : ""}</span>
    ${!opts.written && q.why ? `<div class="prose">${md(q.why)}</div>` : ""}
    ${showModel && q.model ? `<div class="model"><div class="eyebrow lbl">Řešení</div><div class="prose">${md(q.model)}</div></div>` : ""}
    ${g < 2 ? refLink(q, false) : refLink(q, true)}
    ${opts.allowOverride ? `<div class="row"><button class="btn ghost" id="ovr">Moje odpověď je taky správně (jiný zápis)</button></div>` : ""}
    <div class="nav-row"><span></span><button class="btn primary" id="next">${s.idx + 1 >= s.plan.length ? "Dokončit" : "Další"}</button></div>`;
  fb.appendChild(block);
  typeset(block);
  record(q, g, it);
  const ovr = $("#ovr", block); if (ovr) ovr.addEventListener("click", () => { ovr.remove(); block.className = "feedback g2"; block.querySelector(".verdict").textContent = "Uznáno jako správně"; record(q, 2, it, true); });
  $("#next", block).addEventListener("click", nextQ);
  $("#next", block).focus({ preventScroll: true });
  block.scrollIntoView({ behavior: "smooth", block: "nearest" });
}
function record(q, g, it, override) {
  const s = state.session;
  if (it.again) { return; }
  if (!override) { cur.prevP = state.P[q.id]; cur.prevSet = true; }
  const prev = cur.prevSet ? cur.prevP : state.P[q.id];
  const sc = schedule(prev, g);
  const base = prev ? Object.assign({}, prev) : { n: 0, ok: 0, part: 0, bad: 0, h: "" };
  base.n = (base.n || 0) + 1; if (g === 2) base.ok = (base.ok || 0) + 1; else if (g === 1) base.part = (base.part || 0) + 1; else base.bad = (base.bad || 0) + 1;
  base.h = ((base.h || "") + g).slice(-10); base.box = sc.box; base.due = sc.due; base.g = g; base.last = today(); base.ts = Date.now(); base.sec = q.sec; base.type = q.type;
  if (cur.hints) base.hints = (base.hints || 0) + cur.hints;
  state.P[q.id] = base;
  if (state.db) queueWrite("progress/" + q.id, () => state.db.doc("progress/" + q.id).set(base));
  s.res[q.id] = g;
  // wrong or partial light question: ask again at end of this session
  if (!override && g < 2 && TYPES[q.type].light && !s.plan.some((x, i) => i > s.idx && x.id === q.id)) s.plan.push({ id: q.id, again: true });
  if (override) { const k = s.plan.findIndex((x, i) => i > s.idx && x.id === q.id && x.again); if (k > -1) s.plan.splice(k, 1); }
  if (s.kind === "daily" && state.log) { state.log.res = s.res; state.log.plan = s.plan; state.log.answered = Object.keys(s.res).length; }
  else { const l = state.log && state.log.date === today() ? state.log : (state.log = { date: today(), mode: "daily", plan: null, idx: 0, res: {}, done: false, answered: 0 }); l.extraN = (l.extraN || 0) + (override ? 0 : 1); }
}
function nextQ() {
  const s = state.session; s.idx++;
  if (s.kind === "daily" && state.log) state.log.idx = s.idx;
  saveLog();
  window.scrollTo({ top: 0 });
  renderQuestion();
}
function renderSessionEnd() {
  const s = state.session; const el = $("#view");
  const res = Object.entries(s.res); const ok = res.filter(([, g]) => g === 2).length, pt = res.filter(([, g]) => g === 1).length, bad = res.filter(([, g]) => g === 0).length;
  const wrongQs = res.filter(([, g]) => g < 2).map(([id]) => state.Q.get(id)).filter(Boolean);
  const refs = {}; wrongQs.forEach(q => { const k = (q.ref && q.ref.s) || q.sec; (refs[k] = refs[k] || { q, n: 0 }).n++; });
  const daily = s.kind === "daily";
  if (daily && state.log) { state.log.done = true; state.log.t1 = Date.now(); saveLog(); loadLogs(); }
  el.innerHTML = `<section class="panel done-card"><span class="eyebrow">${esc(daily ? "Denní sezení" : modeName(s.mode))}</span>
      <h1>${bad + pt === 0 ? "Všechno správně" : "Hotovo"}</h1>
      <div class="tally"><span><b class="mono" style="color:var(--ok)">${ok}</b>správně</span><span><b class="mono" style="color:var(--part)">${pt}</b>částečně</span><span><b class="mono" style="color:var(--bad)">${bad}</b>špatně</span></div>
      ${Object.keys(refs).length ? `<div class="stack"><span class="eyebrow">Dnes si přečti znovu</span>${Object.entries(refs).sort((a, b) => secCmp(a[0], b[0])).map(([, x]) => refLink(x.q, false)).join("")}</div>` : `<p class="muted">Bez chyb. Tyhle otázky se vrátí za pár dní.</p>`}
      <div class="row"><button class="btn primary" id="end-home">Zpět na začátek</button><button class="btn" data-act="extra" data-mode="weak">Slabá místa</button></div></section>`;
  state.session = null;
  $("#end-home").addEventListener("click", () => render());
  bindView(el); typeset(el);
}

/* keep an unsent draft across live updates of this page */
if (window.claude && window.claude.hot && window.claude.hot.snapshot) {
  try { window.claude.hot.snapshot(() => ({ qid: cur && cur.q && cur.q.id, draft: cur && cur.draft })); } catch (e) {}
}
</script>

</body>
</html>
